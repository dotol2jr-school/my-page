    <meta charset="UTF-8">

    <title>nyang-i</title>
    <!-- 동양적/무술 도장 느낌을 내는 폰트 로드 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-color: #F4EAD4; /* 한지/도장 느낌의 아이보리 background */
            --dojo-wood: #4A2E17; /* 도장 목재 색상 */
            --dojo-dark: #2B1810;
            --accent-red: #C0392B; /* 붉은 인장/띠 색상 */
            --gold-yellow: #D4AC0D;
            --paper-card: #FAF4E8;
            --text-color: #2C221E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Gowun Batang', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            /* 한지 텍스처 및 무협 도장 느낌 배경 */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(74, 46, 23, 0.05) 0%, transparent 60%),
                linear-gradient(to right, rgba(74, 46, 23, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(74, 46, 23, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            padding: 20px 15px 50px 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 무술도장 현판/헤더 */
        header {
            text-align: center;
            background: var(--paper-card);
            padding: 25px 20px;
            border-radius: 12px;
            border: 4px solid var(--dojo-wood);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15), inset 0 0 0 2px var(--gold-yellow);
            margin-bottom: 25px;
            position: relative;
        }

        header::before, header::after {
            content: '🥋';
            position: absolute;
            top: 15px;
            font-size: 1.3rem;
        }
        header::before { left: 15px; }
        header::after { right: 15px; }

        .dojo-badge {
            display: inline-block;
            background-color: var(--accent-red);
            color: #FFF;
            padding: 4px 14px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 8px;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        h1 {
            font-family: 'East Sea Dokdo', cursive;
            font-size: 3rem;
            color: var(--dojo-dark);
            margin-bottom: 4px;
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #6E472A;
            font-weight: bold;
        }

        /* 섹션 공통 프레임 */
        section {
            background: var(--paper-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            border: 3px solid var(--dojo-wood);
            box-shadow: 0 5px 12px rgba(0,0,0,0.08);
            position: relative;
        }

        .section-title {
            font-family: 'Nanum Brush Script', cursive;
            font-size: 2.2rem;
            color: var(--accent-red);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px dashed #D7C4A5;
            padding-bottom: 6px;
        }

        /* 카드 뒤집기 (좋아하는 것 3가지: 비급서 컨셉) */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .flip-card {
            background-color: transparent;
            height: 115px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 10px;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 15px;
            border: 2px solid var(--dojo-wood);
        }

        /* 카드 앞면 */
        .flip-card-front {
            background: #EFE3C8;
            color: var(--dojo-dark);
            gap: 15px;
        }

        .card-icon {
            font-size: 2.2rem;
            background: #FAF4E8;
            width: 58px;
            height: 58px;
            border-radius: 8px;
            border: 2px solid var(--dojo-wood);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card-front-text {
            text-align: left;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--accent-red);
        }

        .card-hint {
            font-size: 0.8rem;
            color: #7A5C43;
            margin-top: 4px;
        }

        /* 카드 뒷면 */
        .flip-card-back {
            background: #4A2E17;
            color: #FFF;
            transform: rotateY(180deg);
            justify-content: center;
            align-items: center;
            font-size: 0.92rem;
            line-height: 1.45;
            word-break: keep-all;
            text-align: center;
            padding: 15px;
            border: 2px solid var(--accent-red);
        }

        /* OX 퀴즈 */
        .quiz-box {
            text-align: center;
            background: #EFE3C8;
            padding: 20px 15px;
            border-radius: 10px;
            border: 2px solid var(--dojo-wood);
        }

        .quiz-question {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--dojo-dark);
        }

        .quiz-btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .quiz-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid var(--dojo-wood);
            font-size: 2rem;
            font-weight: bold;
            font-family: 'East Sea Dokdo', cursive;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .btn-o {
            background-color: #27AE60;
            color: #FFF;
        }

        .btn-x {
            background-color: var(--accent-red);
            color: #FFF;
        }

        .quiz-btn:active {
            transform: scale(0.92);
        }

        .quiz-result {
            margin-top: 15px;
            font-size: 1rem;
            font-weight: bold;
            min-height: 24px;
        }

        /* 오늘의 무술 운세 */
        .fortune-box {
            text-align: center;
        }

        .fortune-display {
            min-height: 85px;
            background: #EFE3C8;
            border-radius: 10px;
            border: 2px solid var(--dojo-wood);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 1rem;
            color: var(--dojo-dark);
            font-weight: bold;
            line-height: 1.45;
            word-break: keep-all;
        }

        .custom-btn {
            background: var(--dojo-wood);
            color: #FFF;
            border: 2px solid var(--dojo-dark);
            padding: 12px 25px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0px var(--dojo-dark);
            transition: all 0.1s ease;
            font-family: 'Gowun Batang', serif;
            width: 100%;
            max-width: 250px;
        }

        .custom-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0px var(--dojo-dark);
        }

        /* 10초 무술 미니게임 */
        .game-box {
            text-align: center;
        }

        .game-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            background: #EFE3C8;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--dojo-wood);
        }

        .stat-item {
            font-size: 0.95rem;
            color: var(--dojo-dark);
        }

        .stat-value {
            font-weight: bold;
            font-size: 1.3rem;
            color: var(--accent-red);
        }

        .click-target {
            width: 110px;
            height: 110px;
            background: var(--accent-red);
            border-radius: 50%;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            cursor: pointer;
            box-shadow: 0 6px 0px #800000, 0 10px 15px rgba(0,0,0,0.2);
            transition: transform 0.05s ease;
            border: 4px solid var(--dojo-dark);
            color: white;
        }

        .click-target:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #800000;
        }

        .click-target.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(60%);
        }

        .game-msg {
            font-size: 0.95rem;
            color: var(--dojo-dark);
            min-height: 40px;
            font-weight: bold;
            line-height: 1.4;
        }

        /* 오답용 흔들기 애니메이션 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        /* 정답용 바운스 애니메이션 */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .bounce {
            animation: bounce 0.4s ease;
        }

        footer {
            text-align: center;
            font-size: 0.85rem;
            color: #7A5C43;
            margin-top: 30px;
        }
    </style>

<script data-studio="js">
(function () {
    function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
    each('[data-st="tabs"]', function (t) {
      var bs = t.querySelectorAll('.st-tab'), ps = t.querySelectorAll('.st-tab-panel');
      function show(i) { bs.forEach(function (b, k) { b.classList.toggle('is-on', k === i); b.setAttribute('aria-selected', k === i); }); ps.forEach(function (p, k) { p.hidden = k !== i; }); }
      bs.forEach(function (b, i) { b.addEventListener('click', function () { show(i); }); });
      show(0);
    });
    each('[data-st-open]', function (b) { b.addEventListener('click', function () { var d = document.getElementById(b.getAttribute('data-st-open')); if (d && d.showModal) d.showModal(); }); });
    each('dialog.st-modal', function (d) { d.addEventListener('click', function (e) { if (e.target === d || e.target.closest('[data-st-close]')) d.close(); }); });
    each('[data-st="slider"]', function (s) {
      var tr = s.querySelector('.st-slides'), dots = s.querySelector('.st-dots'), i = 0, n = tr.children.length;
      function paint() { if (dots) Array.prototype.forEach.call(dots.children, function (d, k) { d.classList.toggle('is-on', k === i); }); }
      function go(k) { i = (k + n) % n; tr.scrollTo({ left: tr.clientWidth * i, behavior: 'smooth' }); paint(); }
      if (dots) { dots.innerHTML = ''; for (var k = 0; k < n; k++) (function (k) { var d = document.createElement('button'); d.type = 'button'; d.setAttribute('aria-label', (k + 1) + '번째 사진'); d.addEventListener('click', function () { go(k); }); dots.appendChild(d); })(k); }
      var pv = s.querySelector('.st-prev'), nx = s.querySelector('.st-next');
      if (pv) pv.addEventListener('click', function () { go(i - 1); });
      if (nx) nx.addEventListener('click', function () { go(i + 1); });
      tr.addEventListener('scroll', function () { var k = Math.round(tr.scrollLeft / (tr.clientWidth || 1)); if (k !== i) { i = k; paint(); } });
      paint();
    });
    each('[data-st="quiz"]', function (q) {
      var r = q.querySelector('.st-qr'), os = q.querySelectorAll('.st-opt');
      os.forEach(function (o) { o.addEventListener('click', function () { var ok = o.hasAttribute('data-ok'); os.forEach(function (x) { x.classList.remove('is-ok', 'is-no'); }); o.classList.add(ok ? 'is-ok' : 'is-no'); if (r) r.textContent = ok ? (q.getAttribute('data-ok-msg') || '정답이에요!') : (q.getAttribute('data-no-msg') || '다시 생각해 봐요.'); }); });
    });
    each('[data-st="check"]', function (c, ci) {
      var bs = c.querySelectorAll('input[type=checkbox]'), out = c.querySelector('.st-cnt'), bar = c.querySelector('.st-bar i'), key = 'st-check-' + location.pathname + '-' + ci, sv = {};
      try { sv = JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (e) {}
      function up() { var d = 0; bs.forEach(function (b) { if (b.checked) d++; }); if (out) out.textContent = d + ' / ' + bs.length + ' 완료'; if (bar) bar.style.width = (bs.length ? d / bs.length * 100 : 0) + '%'; }
      bs.forEach(function (b, i) { b.checked = !!sv[i]; b.addEventListener('change', function () { sv[i] = b.checked; try { localStorage.setItem(key, JSON.stringify(sv)); } catch (e) {} up(); }); });
      up();
    });
    each('[data-st="dday"]', function (e) {
      var o = e.querySelector('.st-dnum'), t = new Date(e.getAttribute('data-date') + 'T00:00:00'), now = new Date(); now.setHours(0, 0, 0, 0);
      var d = Math.round((t - now) / 864e5); if (o) o.textContent = isNaN(d) ? '날짜를 정해요' : d > 0 ? 'D-' + d : d === 0 ? 'D-DAY' : 'D+' + (-d);
    });
    each('[data-st="timer"]', function (e) {
      var m = +e.getAttribute('data-min') || 25, left = m * 60, id = 0, o = e.querySelector('.st-tnum'), go = e.querySelector('.st-tgo'), rs = e.querySelector('.st-trs');
      function p() { o.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'); }
      function stop() { clearInterval(id); id = 0; go.textContent = '시작'; }
      go.addEventListener('click', function () { if (id) { stop(); return; } o.classList.remove('is-done'); id = setInterval(function () { if (left > 0) { left--; p(); } if (left <= 0) { stop(); o.classList.add('is-done'); } }, 1000); go.textContent = '잠시 멈춤'; });
      rs.addEventListener('click', function () { stop(); left = m * 60; o.classList.remove('is-done'); p(); });
      p();
    });
    each('[data-st="dark"]', function (b) {
      try { if (localStorage.getItem('st-dark') === '1') document.documentElement.classList.add('st-dark'); } catch (e) {}
      b.addEventListener('click', function () { var on = document.documentElement.classList.toggle('st-dark'); try { localStorage.setItem('st-dark', on ? '1' : '0'); } catch (e) {} });
    });
    // 스크롤 등장 효과: 화면에 들어오면 나타남 (지원하지 않는 브라우저·움직임 줄이기 설정에서는 그냥 보임)
    var ins = document.querySelectorAll('[data-st-in]');
    if (ins.length && 'IntersectionObserver' in window && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) {
      document.documentElement.classList.add('st-js');
      var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } }); }, { threshold: 0.08 });
      Array.prototype.forEach.call(ins, function (e) { io.observe(e); });
    }
  })();
</script>
